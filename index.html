<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Визнач свій архетип</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<section id="start">
  <h1>Визнач свій архетип</h1>
  <p class="sub">12 питань, 2 хвилини. Без реєстрації, без оплати, без смс. Відповідай чесно — результат побачиш одразу.</p>
  <div class="tiers" id="tiers"></div>
  <button class="btn" id="go">Почати тест</button>
</section>
<section id="quiz" class="hide">
  <div class="cnt" id="cnt"></div>
  <div class="bar"><i id="fill"></i></div>
  <h2 id="q"></h2>
  <div id="opts"></div>
</section>
<section id="res" class="hide res">
  <span class="tag" id="rtier"></span>
  <div class="emoji" id="remoji"></div>
  <h1 id="rname"></h1>
  <p id="rdesc"></p>
  <p id="rrole" class="sub"></p>
  <button class="btn" id="share">Поділитися з друзями</button>
  <button class="btn alt" id="again">Пройти ще раз</button>
  <div class="mini" id="mini"></div>
  <p class="note">Це розважальний тест, а не наукова оцінка інтелекту чи особистості.</p>
</section>
</main>
<script src="script.js"></script>
</body>
</html>
